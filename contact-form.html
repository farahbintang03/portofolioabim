<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact form — Farah Bintang Mulya</title>
  </head>
  <body>
    <!-- Static form marker for Netlify Forms detection. The primary form lives on index.html. -->
    <form name="contact" method="POST" netlify data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html">
      <input type="hidden" name="form-name" value="contact">
      <p hidden><label>Jangan isi ini: <input name="bot-field"></label></p>
      <label>Nama <input name="name" required></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Subject <input name="subject" required></label>
      <label>Pesan <textarea name="message" required></textarea></label>
      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
